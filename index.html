const LET = ["A","B","C","D"];
const ROM = ["I","II","III","IV"];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- State ---------- */
const S = {view:"home", i:0, filter:"all", chosen:{}, revealed:{}, fs:1};
try{ const sv=JSON.parse(localStorage.getItem("kuizSejK1SBP26")||"{}"); Object.assign(S.chosen,sv.chosen||{}); Object.assign(S.revealed,sv.revealed||{}); if(sv.fs) S.fs=sv.fs; }catch(e){}
function save(){ try{ localStorage.setItem("kuizSejK1SBP26",JSON.stringify({chosen:S.chosen,revealed:S.revealed,fs:S.fs})); }catch(e){} }
function status(n){ const c=S.chosen[n]; const q=Q[n-1]; if(c) return c===q.a?"ok":"bad"; if(S.revealed[n]) return "rev"; return ""; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function setFs(v){ S.fs=Math.max(.8,Math.min(1.6,Math.round(v*10)/10)); document.documentElement.style.setProperty("--fs",S.fs); save(); }
setFs(S.fs);

/* ---------- Views ---------- */
const app = $("#app");
function go(view,i){ S.view=view; if(i!=null) S.i=i; render(); window.scrollTo({top:0}); }

function render(keepScroll){
  const y = window.scrollY;
  Ink.detach();
  if(S.view==="home") renderHome();
  else if(S.view==="q") renderQ();
  else renderBoard();
  if(keepScroll) window.scrollTo({top:y});
}

function renderHome(){
  const done = Object.keys(S.chosen).length;
  const ok = Object.entries(S.chosen).filter(([n,c])=>Q[n-1].a===c).length;
  const list = Q.filter(q=>S.filter==="all"||String(q.t)===S.filter);
  app.innerHTML = `
  <section class="hero">
    <div style="z-index:1;flex:1;min-width:260px">
      <h2>Bedah Soalan Sejarah K1</h2>
      <p>40 soalan objektif lengkap dengan alasan jawapan betul & salah, info tambahan dan tip menjawab. Pilih soalan untuk mula.</p>
      <div class="chips"><span class="chip">Tingkatan 4 · S1–20</span><span class="chip">Tingkatan 5 · S21–40</span><span class="chip">A: 11 · B: 11 · C: 8 · D: 10</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${done}</b><span>Dijawab</span></div>
      <div class="stat"><b style="color:var(--ok)">${ok}</b><span>Betul</span></div>
      <div class="stat"><b>${done?Math.round(ok/done*100):0}%</b><span>Skor</span></div>
    </div>
  </section>
  <div class="filters">
    <button class="ftab ${S.filter==="all"?"on":""}" data-f="all">Semua (40)</button>
    <button class="ftab ${S.filter==="4"?"on":""}" data-f="4">Tingkatan 4</button>
    <button class="ftab ${S.filter==="5"?"on":""}" data-f="5">Tingkatan 5</button>
    <button class="abtn" id="resetAll" style="margin-left:4px">↺ Set semula skor</button>
    <div class="legend"><span><i style="background:var(--t4)"></i>T4</span><span><i style="background:var(--t5)"></i>T5</span><span><i style="background:var(--ok)"></i>Betul</span><span><i style="background:var(--bad)"></i>Salah</span></div>
  </div>
  <div class="grid">${list.map(q=>{const st=status(q.n);return `
    <button class="tile t${q.t} ${st}" data-n="${q.n}">
      <span class="no">${q.n}</span>
      <span class="tp">${esc(q.tp)}</span>
      <span class="meta">T${q.t} · hlm ${q.h}</span>
      ${st?`<span class="st">${st==="ok"?"✓":st==="bad"?"✗":"!"}</span>`:""}
    </button>`}).join("")}</div>
  <p class="foot">Soalan: Peperiksaan Percubaan SPM Sekolah Berasrama Penuh 2026 · Sejarah 1249/1 (© BPSBP)<br>Penerangan, info & tip: <b>Cikgu Rabbani, SMKDUMA, JU Sejarah Negeri</b> · CG R 2026</p>`;
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go("q",+b.dataset.n-1));
  app.querySelectorAll(".ftab").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render();});
  $("#resetAll").onclick=()=>{ if(confirm("Set semula semua jawapan yang telah dipilih?")){S.chosen={};S.revealed={};save();render();} };
}

function stimHTML(s){
  if(!s) return "";
  if(s.k==="box") return `<div class="stim"><div class="sbox">${s.txt}</div></div>`;
  if(s.k==="img") return `<div class="stim"><figure class="simg" style="margin:0"><img src="${IMG[s.src]}" alt="${esc(s.cap)}" style="width:${s.w}px"><figcaption>${esc(s.cap)}</figcaption></figure></div>`;
  if(s.k==="list") return `<div class="stim"><div class="slist">${s.title?`<div class="h">${s.title}</div>`:""}<ul>${s.items.map(x=>`<li>${x==="X"?"<b>X</b>":x}</li>`).join("")}</ul></div></div>`;
  if(s.k==="table2") return `<div class="stim"><table class="stbl two"><tr><td>${s.left}</td><td><ul>${s.items.map(x=>`<li>${x==="X"?"<b>X</b>":x}</li>`).join("")}</ul></td></tr></table></div>`;
  if(s.k==="tbl") return `<div class="stim"><table class="stbl"><tr>${s.head.map(h=>`<th>${h}</th>`).join("")}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  return "";
}

function comboReason(q,optText){
  const nums = optText.match(/IV|III|II|I/g)||[];
  const parts = nums.map(r=>{const it=q.rom[ROM.indexOf(r)];return `${r} ${it[1]?"✓":"✗"}`});
  const allOk = nums.every(r=>q.rom[ROM.indexOf(r)][1]);
  const bad = nums.filter(r=>!q.rom[ROM.indexOf(r)][1]);
  return `<b>${parts.join(" · ")}</b> — ` + (allOk ? "kedua-dua pernyataan tepat." : `mengandungi pernyataan yang tidak tepat (${bad.join(", ")}).`);
}

function renderQ(){
  const q = Q[S.i], n=q.n, ch=S.chosen[n], shown = !!(ch||S.revealed[n]);
  const romHTML = q.rom ? `<ul class="roman ${shown?"show":""}">${q.rom.map((r,k)=>`<li class="${r[1]?"y":"n"}"><b>${ROM[k]}</b><span>${r[0]}</span>${shown?`<span class="mk" style="color:${r[1]?"var(--ok)":"var(--bad)"}">${r[1]?"✓":"✗"}</span>`:""}</li>`).join("")}</ul>` : "";
  const opts = q.o.map((t,k)=>{
    const L=LET[k]; let cls=""; let mk="";
    if(shown){ if(L===q.a){cls="ok";mk="✓";} else if(L===ch){cls="bad";mk="✗";} else cls="dim"; }
    return `<button class="opt ${cls}" data-l="${L}" style="--c:var(--${L})"><span class="L">${L}</span><span>${t}</span><span class="mk">${mk}</span></button>`;
  }).join("");
  let exp="";
  if(shown){
    const v = ch ? (ch===q.a ? `<div class="verdict ok"><span class="big">✓</span><span>Tepat! Jawapan betul ialah <b>${q.a}</b> — ${q.o[LET.indexOf(q.a)]}</span></div>`
                             : `<div class="verdict bad"><span class="big">✗</span><span>Pilihan <b>${ch}</b> kurang tepat. Jawapan betul ialah <b>${q.a}</b> — ${q.o[LET.indexOf(q.a)]}</span></div>`)
               : `<div class="verdict neu"><span class="big">★</span><span>Jawapan betul ialah <b>${q.a}</b> — ${q.o[LET.indexOf(q.a)]}</span></div>`;
    const romBlock = q.rom ? `<div class="block"><h3>🔍 Analisis pernyataan I – IV</h3><div class="why">${q.rom.map((r,k)=>`<div class="r ${r[1]?"y":"n"}"><span class="L">${ROM[k]}</span><div><div class="ot">${r[0]}<em>${r[1]?"BETUL":"SALAH"}</em></div><div class="rs">${r[2]}</div></div></div>`).join("")}</div></div>` : "";
    const why = `<div class="block"><h3>⚖️ Kenapa betul & kenapa salah</h3><div class="why">${q.o.map((t,k)=>{const L=LET[k],y=L===q.a;const rs=q.rom?comboReason(q,t):q.w[k];return `<div class="r ${y?"y":"n"}"><span class="L">${L}</span><div><div class="ot">${t}<em>${y?"JAWAPAN":"SALAH"}</em></div><div class="rs">${rs}</div></div></div>`}).join("")}</div></div>`;
    const info = `<div class="block info"><h3>📘 Info: ${q.info.t}</h3><ul>${q.info.p.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
    const tip = `<div class="tipbox"><strong>Tip guru!</strong>${q.tip}</div>`;
    exp = `<section class="exp">${v}${romBlock}${why}${info}${tip}</section>`;
  }
  app.innerHTML = `
  <div class="qbar">
    <button class="back" id="back">← Kembali</button>
    <div class="dots">${Q.map(x=>`<button class="dot t${x.t} ${status(x.n)} ${x.n===n?"cur":""}" data-n="${x.n}" title="Soalan ${x.n}: ${esc(x.tp)}">${x.n}</button>`).join("")}</div>
  </div>
  <article class="stage" id="stage">
    <div class="qhead">
      <span class="qnum">${n}<small> / 40</small></span>
      <span class="tag t${q.t}">TINGKATAN ${q.t}</span>
      <span class="tag pg">Buku Teks hlm ${q.h}</span>
      <span class="tag topic">${esc(q.tp)}</span>
    </div>
    <div class="qtext">${q.q.replace(/\n/g,"<br>")}</div>
    ${stimHTML(q.stim)}
    ${romHTML}
    <div class="opts">${opts}</div>
    <div class="actions">
      ${shown?`<button class="abtn" id="hide">↺ Sembunyi jawapan (tanya semula)</button>`:`<button class="abtn gold" id="reveal">👁 Dedah jawapan</button>`}
    </div>
    ${exp}
  </article>
  <div class="navrow">
    <button class="nbtn" id="prev" ${S.i===0?"disabled":""}>◀ Soalan ${n-1||""}</button>
    <select class="jump" id="jump">${Q.map(x=>`<option value="${x.n-1}" ${x.n===n?"selected":""}>Soalan ${x.n} — ${esc(x.tp)}</option>`).join("")}</select>
    <button class="nbtn pri" id="next" ${S.i===39?"disabled":""}>Soalan ${n<40?n+1:""} ▶</button>
  </div>
  <div class="help"><span><span class="kbd">←</span> <span class="kbd">→</span> tukar soalan</span><span><span class="kbd">A</span>–<span class="kbd">D</span> pilih jawapan</span><span><span class="kbd">P</span> pen · <span class="kbd">H</span> highlighter · <span class="kbd">T</span> teks · <span class="kbd">E</span> pemadam · <span class="kbd">Esc</span> tetikus</span></div>`;
  $("#back").onclick=()=>go("home");
  app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>go("q",+b.dataset.n-1));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b.dataset.l));
  $("#prev").onclick=()=>S.i>0&&go("q",S.i-1);
  $("#next").onclick=()=>S.i<39&&go("q",S.i+1);
  $("#jump").onchange=e=>go("q",+e.target.value);
  const rv=$("#reveal"); if(rv) rv.onclick=()=>{S.revealed[n]=1;save();render(true);};
  const hd=$("#hide"); if(hd) hd.onclick=()=>{delete S.chosen[n];delete S.revealed[n];save();render(true);};
  Ink.attach($("#stage"),"q"+n);
}
function choose(L){ const n=Q[S.i].n; if(S.chosen[n]||S.revealed[n]) return; S.chosen[n]=L; save(); render(true); }

function renderBoard(){
  app.innerHTML = `
  <div class="qbar"><button class="back" id="back">← Kembali</button>
  <button class="abtn" id="newb">＋ Halaman baharu</button><span id="bpg" style="font-weight:700;color:var(--muted)"></span></div>
  <article class="stage board" id="stage"><h2>Papan Tulis</h2><p>Gunakan pen, highlighter dan teks pada bar alat untuk menerangkan konsep.</p></article>`;
  S.board = S.board||1; S.boards=S.boards||1;
  $("#bpg").innerHTML = Array.from({length:S.boards},(_,k)=>`<button class="dot ${k+1===S.board?"cur":""}" data-b="${k+1}">${k+1}</button>`).join(" ");
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{S.board=+b.dataset.b;render();});
  $("#newb").onclick=()=>{S.boards++;S.board=S.boards;render();};
  $("#back").onclick=()=>go(S.lastQ!=null?"q":"home",S.lastQ);
  Ink.attach($("#stage"),"board"+S.board);
}

/* ---------- Ink (pen / highlighter / text / eraser) ---------- */
const COLORS = ["#E03131","#FFD400","#2BC46B","#1C74C4","#8E44AD","#FF7A1A","#FF5DA2","#1B2232"];
const SIZES = [{p:2,t:22},{p:4,t:30},{p:8,t:42}];
const Ink = {
  tool:"cursor", col:{pen:"#E03131",hl:"#FFD400",text:"#1C74C4"}, si:1,
  store:{}, stage:null, key:null, cv:null, ctx:null, tl:null, cur:null, ro:null, raf:0,
  data(){ return this.store[this.key] || (this.store[this.key]={s:[],t:[],h:[]}); },
  attach(stage,key){
    this.stage=stage; this.key=key;
    const cv=document.createElement("canvas"); cv.className="ink"; stage.appendChild(cv);
    const tl=document.createElement("div"); tl.className="tlayer"; stage.appendChild(tl);
    this.cv=cv; this.ctx=cv.getContext("2d"); this.tl=tl;
    stage.dataset.tool=this.tool; stage.classList.toggle("drawing",this.tool!=="cursor");
    cv.addEventListener("pointerdown",e=>this.down(e));
    cv.addEventListener("pointermove",e=>this.move(e));
    cv.addEventListener("pointerup",e=>this.up(e));
    cv.addEventListener("pointercancel",e=>this.up(e));
    this.ro=new ResizeObserver(()=>this.size()); this.ro.observe(stage);
    this.size();
    this.data().t.forEach(o=>this.mkText(o,false));
    if(S.view==="q") S.lastQ=S.i;
  },
  detach(){ if(this.ro) this.ro.disconnect(); this.ro=null; this.stage=null; this.cur=null; },
  size(){
    if(!this.stage) return;
    const w=this.stage.offsetWidth, h=this.stage.offsetHeight, d=window.devicePixelRatio||1;
    if(this.cv.width===Math.round(w*d) && this.cv.height===Math.round(h*d)) return;
    this.cv.width=Math.round(w*d); this.cv.height=Math.round(h*d);
    this.cv.style.width=w+"px"; this.cv.style.height=h+"px";
    this.ctx.setTransform(d,0,0,d,0,0); this.draw();
  },
  pt(e){ const r=this.stage.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; },
  draw(){
    const c=this.ctx; if(!c) return;
    c.clearRect(0,0,this.cv.width,this.cv.height);
    const st=this.data().s;
    st.filter(s=>s.k==="hl").forEach(s=>this.stroke(s));
    st.filter(s=>s.k!=="hl").forEach(s=>this.stroke(s));
  },
  stroke(s){
    const c=this.ctx, p=s.p; c.save();
    c.strokeStyle=s.c; c.fillStyle=s.c; c.lineJoin="round"; c.lineCap="round";
    if(s.k==="hl"){ c.globalAlpha=.38; c.globalCompositeOperation="multiply"; c.lineWidth=s.w; }
    else c.lineWidth=s.w;
    if(p.length===1){ c.beginPath(); c.arc(p[0][0],p[0][1],s.w/2,0,7); c.fill(); }
    else{
      c.beginPath(); c.moveTo(p[0][0],p[0][1]);
      for(let i=1;i<p.length-1;i++){ const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2; c.quadraticCurveTo(p[i][0],p[i][1],mx,my); }
      const l=p[p.length-1]; c.lineTo(l[0],l[1]); c.stroke();
    }
    c.restore();
  },
  req(){ if(!this.raf) this.raf=requestAnimationFrame(()=>{this.raf=0;this.draw();}); },
  down(e){
    if(this.tool==="cursor") return;
    e.preventDefault();
    const p=this.pt(e), D=this.data();
    if(this.tool==="pen"||this.tool==="hl"){
      const hl=this.tool==="hl";
      this.cur={k:this.tool,c:this.col[this.tool],w:hl?SIZES[this.si].p*5+6:SIZES[this.si].p,p:[p]};
      D.s.push(this.cur); D.h.push(this.cur);
      this.cv.setPointerCapture(e.pointerId); this.req();
    } else if(this.tool==="eraser"){
      this.erasing=true; this.cv.setPointerCapture(e.pointerId); this.erase(p);
    } else if(this.tool==="text"){
      const o={x:p[0],y:p[1]-SIZES[this.si].t*.6,c:this.col.text,f:SIZES[this.si].t,v:""};
      D.t.push(o); D.h.push(o); this.mkText(o,true);
    }
  },
  move(e){
    if(this.cur){ const p=this.pt(e), l=this.cur.p[this.cur.p.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])>1.2){ this.cur.p.push(p); this.req(); } }
    else if(this.erasing) this.erase(this.pt(e));
  },
  up(){ this.cur=null; this.erasing=false; },
  erase(p){
    const D=this.data(), R=14;
    const hit=s=>{ for(let i=0;i<s.p.length;i++){ const a=s.p[i], b=s.p[i+1]||a; if(segD(p,a,b)<R+s.w/2) return true; } return false; };
    const before=D.s.length; const gone=D.s.filter(hit);
    if(gone.length){ D.s=D.s.filter(s=>!gone.includes(s)); D.h=D.h.filter(x=>!gone.includes(x)); this.draw(); }
  },
  mkText(o,focus){
    const b=document.createElement("div"); b.className="tbox";
    b.style.left=o.x+"px"; b.style.top=o.y+"px"; b.style.color=o.c; b.style.fontSize=o.f+"px";
    b.innerHTML=`<button class="grip" title="Seret">✥</button><div class="ed" contenteditable="true" spellcheck="false"></div><button class="del" title="Padam">✕</button>`;
    const ed=b.querySelector(".ed"); ed.textContent=o.v;
    ed.addEventListener("input",()=>{o.v=ed.innerText;});
    ed.addEventListener("blur",()=>{ if(!o.v.trim()) this.rmText(o,b); });
    ed.addEventListener("keydown",e=>{ if(e.key==="Escape"){ ed.blur(); } e.stopPropagation(); });
    b.querySelector(".del").onclick=()=>this.rmText(o,b);
    b.addEventListener("pointerdown",e=>{ if(this.tool==="eraser"){ e.preventDefault(); this.rmText(o,b);} });
    const g=b.querySelector(".grip");
    g.addEventListener("pointerdown",e=>{
      e.preventDefault(); g.setPointerCapture(e.pointerId);
      const sx=e.clientX, sy=e.clientY, ox=o.x, oy=o.y;
      const mv=ev=>{ o.x=ox+ev.clientX-sx; o.y=oy+ev.clientY-sy; b.style.left=o.x+"px"; b.style.top=o.y+"px"; };
      const end=()=>{ g.removeEventListener("pointermove",mv); g.removeEventListener("pointerup",end); };
      g.addEventListener("pointermove",mv); g.addEventListener("pointerup",end);
    });
    o.el=b; this.tl.appendChild(b);
    if(focus){ ed.focus(); setTimeout(()=>{ if(document.activeElement!==ed) ed.focus(); },0); }
  },
  rmText(o,b){ const D=this.data(); D.t=D.t.filter(x=>x!==o); D.h=D.h.filter(x=>x!==o); b.remove(); },
  undo(){
    const D=this.data(); const x=D.h.pop(); if(!x){ toast("Tiada coretan untuk dibuat asal"); return; }
    if(D.s.includes(x)){ D.s=D.s.filter(s=>s!==x); this.draw(); }
    else { D.t=D.t.filter(t=>t!==x); if(x.el) x.el.remove(); }
  },
  clear(){
    const D=this.data(); if(!D.s.length && !D.t.length){ toast("Tiada coretan"); return; }
    D.s=[]; D.t=[]; D.h=[]; this.tl.innerHTML=""; this.draw(); toast("Semua coretan dipadam");
  },
  setTool(t){
    this.tool=t;
    document.querySelectorAll(".tools .t[data-tool]").forEach(b=>b.classList.toggle("on",b.dataset.tool===t));
    if(this.stage){ this.stage.dataset.tool=t; this.stage.classList.toggle("drawing",t!=="cursor"); }
    paintSwatches();
  }
};
function segD(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy)); }

/* ---------- Toolbar ---------- */
function activeColKey(){ return ["pen","hl","text"].includes(Ink.tool)?Ink.tool:"pen"; }
function paintSwatches(){
  const k=activeColKey();
  $("#swatches").innerHTML = COLORS.map(c=>`<button style="background:${c}" class="${Ink.col[k]===c?"on":""}" data-c="${c}" title="Warna"></button>`).join("");
  $("#swatches").querySelectorAll("button").forEach(b=>b.onclick=()=>{ Ink.col[k]=b.dataset.c; if(Ink.tool==="cursor"||Ink.tool==="eraser") Ink.setTool("pen"); else paintSwatches(); });
  $("#sizes").innerHTML = SIZES.map((s,i)=>`<button class="${Ink.si===i?"on":""}" data-i="${i}" title="Saiz ${["kecil","sederhana","besar"][i]}"><i style="width:${[14,22,30][i]}px;height:${[3,5,8][i]}px"></i></button>`).join("");
  $("#sizes").querySelectorAll("button").forEach(b=>b.onclick=()=>{ Ink.si=+b.dataset.i; paintSwatches(); });
}
document.querySelectorAll(".tools .t[data-tool]").forEach(b=>b.onclick=()=>Ink.setTool(b.dataset.tool));
$("#undo").onclick=()=>Ink.undo();
$("#clear").onclick=()=>Ink.clear();
$("#mini").onclick=()=>$("#tools").classList.toggle("mini");
paintSwatches();
if(window.innerWidth<760) $("#tools").classList.add("mini");

/* ---------- Header ---------- */
$("#brand").onclick=$("#btnHome").onclick=()=>go("home");
$("#btnBoard").onclick=()=>go("board");
$("#zIn").onclick=()=>setFs(S.fs+.1);
$("#zOut").onclick=()=>setFs(S.fs-.1);
$("#btnFull").onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); };

/* ---------- Keyboard ---------- */
document.addEventListener("keydown",e=>{
  const tg=e.target; if(tg.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(tg.tagName)) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){ e.preventDefault(); Ink.undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k==="escape"||k==="v") Ink.setTool("cursor");
  else if(k==="p") Ink.setTool("pen");
  else if(k==="h") Ink.setTool("hl");
  else if(k==="t") Ink.setTool("text");
  else if(k==="e") Ink.setTool("eraser");
  else if(S.view==="q"){
    if(k==="arrowright"&&S.i<39) go("q",S.i+1);
    else if(k==="arrowleft"&&S.i>0) go("q",S.i-1);
    else if(["a","b","c","d"].includes(k)) choose(k.toUpperCase());
    else if(k===" "){ e.preventDefault(); const n=Q[S.i].n; if(!S.chosen[n]&&!S.revealed[n]){S.revealed[n]=1;save();render(true);} }
  }
});

render();
</script>
