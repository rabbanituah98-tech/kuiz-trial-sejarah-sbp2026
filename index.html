<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuiz Sejarah K1 SBP 2026</title>
<meta name="description" content="Kuiz interaktif Sejarah Kertas 1 Percubaan SPM SBP 2026 dengan penerangan jawapan dan alat anotasi untuk pengajaran.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6EFE2; --card:#FFFDF8; --ink:#1B2232; --muted:#5E6676; --line:#E6DCC8;
  --navy:#0F2645; --navy2:#1D4473; --gold:#E0A526; --gold2:#F5D27A; --maroon:#8E1F2B;
  --ok:#23944A; --okbg:#E5F4EA; --bad:#D23B35; --badbg:#FCE8E6;
  --A:#6D3FB2; --B:#1C74C4; --C:#D9820B; --D:#0F8C7E;
  --t4:#1D4473; --t5:#8E1F2B;
  --fs:1;
  --disp:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(15,38,69,.06) 1px,transparent 0);background-size:22px 22px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* ===== Header ===== */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--gold);box-shadow:0 4px 18px rgba(15,38,69,.25)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.seal{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:18px;box-shadow:inset 0 0 0 3px var(--navy),0 0 0 2px var(--gold)}
.brand h1{font-family:var(--disp);font-size:19px;margin:0;line-height:1.1;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:var(--gold2);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.top .sp{flex:1}
.hbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.hbtn svg{width:16px;height:16px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 120px 84px}
/* ===== Home ===== */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 24px rgba(15,38,69,.07);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(224,165,38,.28),transparent 70%)}
.hero h2{font-family:var(--disp);font-size:clamp(24px,3.4vw,34px);margin:0 0 4px;color:var(--navy);line-height:1.15}
.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F1E7D2;color:var(--navy)}
.stats{display:flex;gap:10px;margin-left:auto;z-index:1}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;min-width:86px}
.stat b{display:block;font-family:var(--disp);font-size:26px;color:var(--navy);line-height:1}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.filters{display:flex;gap:8px;margin:20px 0 12px;flex-wrap:wrap;align-items:center}
.ftab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.ftab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.legend{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;min-height:108px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--t4)}
.tile.t5:before{background:var(--t5)}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(15,38,69,.12);border-color:var(--gold)}
.tile .no{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--navy);line-height:1}
.tile .tp{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{margin-top:auto;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.tile .st{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.tile.ok .st{background:var(--ok)} .tile.bad .st{background:var(--bad)} .tile.rev .st{background:var(--gold);color:var(--navy)}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.foot b{color:var(--navy)}
/* ===== Question ===== */
.qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.back{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.back:hover{background:var(--navy2)}
.dots{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:240px}
.dot{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:11.5px;font-weight:700;color:var(--muted);padding:0}
.dot.t5{border-bottom-color:var(--t5)} .dot.t4{border-bottom-color:var(--t4)}
.dot.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.dot.rev{background:#FFF4D6;border-color:var(--gold);color:#8a5d00}
.dot.cur{background:var(--navy);color:#fff;border-color:var(--navy);transform:scale(1.12)}
select.jump{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-weight:600;background:var(--card);color:var(--ink);max-width:260px}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 26px 26px;box-shadow:0 8px 28px rgba(15,38,69,.08);font-size:calc(17px * var(--fs))}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qnum{font-family:var(--disp);font-weight:800;font-size:2.1em;color:var(--navy);line-height:1}
.qnum small{font-size:.42em;color:var(--muted);font-family:var(--body);font-weight:700}
.tag{font-size:.72em;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.3px}
.tag.t4{background:#E3EBF6;color:var(--t4)} .tag.t5{background:#F6E2E4;color:var(--t5)}
.tag.pg{background:#F1E7D2;color:#6b4e12}
.tag.topic{background:var(--navy);color:var(--gold2)}
.qtext{font-size:1.18em;font-weight:600;line-height:1.55;margin:4px 0 14px}
.stim{display:flex;justify-content:center;margin:6px 0 16px}
.sbox{border:2px solid var(--ink);padding:10px 22px;font-weight:700;background:#fff;text-align:center;max-width:620px}
.simg{text-align:center}
.simg img{max-width:100%;border-radius:10px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);background:#fff}
.simg figcaption{font-size:.8em;color:var(--muted);margin-top:6px;font-style:italic}
.slist{border:2px solid var(--ink);background:#fff;min-width:300px}
.slist .h{font-weight:800;text-align:center;border-bottom:2px solid var(--ink);padding:6px 14px}
.slist ul{margin:0;padding:8px 18px 8px 34px}
.slist li{padding:2px 0;font-weight:600}
.stbl{border-collapse:collapse;background:#fff}
.stbl td,.stbl th{border:2px solid var(--ink);padding:7px 16px;text-align:left}
.stbl th{background:#F1E7D2}
.stbl.two td:first-child{font-weight:800;vertical-align:middle;text-align:center}
.stbl.two ul{margin:0;padding-left:20px}
.roman{list-style:none;padding:0;margin:0 0 16px 6px}
.roman li{display:flex;gap:14px;padding:5px 10px;border-radius:10px;font-weight:600;align-items:baseline}
.roman li b{min-width:28px;font-family:var(--disp);color:var(--navy)}
.roman.show li.y{background:var(--okbg)} .roman.show li.n{background:var(--badbg);opacity:.8}
.roman .mk{margin-left:auto;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1em;font-weight:600;color:var(--ink);transition:all .15s;position:relative}
.opt:hover{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 15%,transparent)}
.opt .L{flex:none;width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1.2em}
.opt .mk{margin-left:auto;font-weight:800;font-size:1.2em}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .L{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .L{background:var(--bad)}
.opt.dim{opacity:.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.abtn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 13px;font-weight:700;font-size:14px;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
.abtn:hover{border-color:var(--navy)}
.abtn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
/* explanation */
.exp{margin-top:22px;display:grid;gap:14px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{border-radius:16px;padding:14px 18px;font-weight:700;display:flex;gap:12px;align-items:center;font-size:1.02em}
.verdict.ok{background:var(--okbg);color:#14612f;border:1.5px solid #a6dbb6}
.verdict.bad{background:var(--badbg);color:#8f1f1b;border:1.5px solid #f1b3ae}
.verdict.neu{background:#FFF4D6;color:#6b4800;border:1.5px solid #f0d488}
.verdict .big{font-family:var(--disp);font-size:2em;line-height:1}
.block{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.block h3{margin:0;padding:10px 16px;font-size:.9em;letter-spacing:.6px;text-transform:uppercase;background:var(--paper);color:var(--navy);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.why{display:grid}
.why .r{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:11px 16px;border-top:1px dashed var(--line);align-items:start}
.why .r:first-child{border-top:none}
.why .r .L{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--disp)}
.why .r.y{background:var(--okbg)} .why .r.y .L{background:var(--ok)}
.why .r.n .L{background:#b9b2a5}
.why .r .ot{font-weight:800;margin-bottom:2px}
.why .r .ot em{font-style:normal;font-size:.78em;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.why .r.y .ot em{background:var(--ok);color:#fff} .why .r.n .ot em{background:#efe6d6;color:#7a6a4a}
.why .r .rs{color:#3b4352;font-weight:500;font-size:.95em}
.info{border:none;background:linear-gradient(135deg,#0F2645,#1D4473);color:#fff}
.info h3{background:rgba(255,255,255,.06);color:var(--gold2);border-bottom:1px solid rgba(255,255,255,.12)}
.info ul{margin:0;padding:12px 18px 14px 36px}
.info li{margin:6px 0;line-height:1.5}
.info li b{color:var(--gold2)}
.tipbox{border:2px dashed var(--gold);background:#FFF8E6;border-radius:16px;padding:12px 16px;font-weight:500}
.tipbox strong{font-family:var(--hand);font-size:1.45em;color:var(--maroon);margin-right:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.nbtn{background:var(--card);border:2px solid var(--navy);color:var(--navy);border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.nbtn.pri{background:var(--navy);color:#fff}
.nbtn:disabled{opacity:.35;cursor:default}
/* board */
.board{min-height:72vh;background-color:#fff;background-image:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:32px 32px}
.board h2{font-family:var(--disp);color:var(--navy);margin:0 0 4px}
.board p{margin:0;color:var(--muted);font-size:.85em}
/* ===== Ink layer ===== */
canvas.ink{position:absolute;left:0;top:0;z-index:5;pointer-events:none;border-radius:22px}
.stage.drawing canvas.ink{pointer-events:auto;touch-action:none}
.stage[data-tool=pen] canvas.ink,.stage[data-tool=hl] canvas.ink{cursor:crosshair}
.stage[data-tool=text] canvas.ink{cursor:text}
.stage[data-tool=eraser] canvas.ink{cursor:cell}
.tlayer{position:absolute;inset:0;z-index:6;pointer-events:none}
.tbox{position:absolute;pointer-events:auto;border:1.5px dashed transparent;border-radius:8px;padding:2px 8px;font-family:var(--hand);font-weight:700;line-height:1.15;background:rgba(255,255,255,.0);min-width:30px}
.tbox:hover,.tbox:focus-within{border-color:currentColor;background:rgba(255,255,255,.75)}
.tbox .ed{outline:none;white-space:pre-wrap;min-width:20px;min-height:1em}
.tbox .grip,.tbox .del{position:absolute;top:-13px;width:22px;height:22px;border-radius:50%;border:none;display:none;place-items:center;font-size:12px;font-family:var(--body);color:#fff;padding:0}
.tbox .grip{left:-12px;background:var(--navy);cursor:move}
.tbox .del{right:-12px;background:var(--bad)}
.tbox:hover .grip,.tbox:hover .del,.tbox:focus-within .grip,.tbox:focus-within .del{display:grid}
.stage[data-tool=eraser] .tbox{cursor:not-allowed}
/* ===== Toolbar ===== */
.tools{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:50;background:var(--navy);border:2px solid var(--gold);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(15,38,69,.35);transition:opacity .2s}
.tools .t{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:#cfd8e6;display:grid;place-items:center;position:relative}
.tools .t svg{width:22px;height:22px}
.tools .t:hover{background:rgba(255,255,255,.1);color:#fff}
.tools .t.on{background:var(--gold);color:var(--navy)}
.tools .t[data-tip]:hover:after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none}
.tools hr{width:100%;border:none;border-top:1px solid rgba(255,255,255,.18);margin:2px 0}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:2px}
.sw button{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.sz{display:flex;flex-direction:column;align-items:center;gap:4px}
.sz button{width:44px;height:22px;border-radius:8px;border:none;background:transparent;display:grid;place-items:center}
.sz button i{display:block;background:#cfd8e6;border-radius:9px}
.sz button.on{background:rgba(255,255,255,.14)} .sz button.on i{background:var(--gold)}
.tools.mini .hide-mini{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.kbd{display:inline-block;font-size:11px;border:1px solid #c9bfa9;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;color:var(--ink);font-weight:700}
.help{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){
  .wrap{padding:14px 12px 110px}
  .tools{left:50%;top:auto;bottom:10px;transform:translateX(-50%);flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
  .tools hr{width:1px;height:auto;border-top:none;border-left:1px solid rgba(255,255,255,.18);margin:0 2px}
  .tools .t{width:38px;height:38px}
  .tools .t[data-tip]:hover:after{display:none}
  .sz{flex-direction:row}.sz button{width:30px}
  .sw{grid-template-columns:repeat(8,1fr);align-content:center}
  .opts{grid-template-columns:1fr}
  .stage{padding:18px 16px}
  .brand h1{font-size:16px}
  .stats{margin-left:0}
  .hbtn .lbl{display:none}
}
@media print{.tools,.top{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" id="brand" title="Ke senarai soalan">
    <div class="seal">S</div>
    <div><h1>Kuiz Sejarah Kertas 1</h1><small>Percubaan SPM SBP 2026 · 1249/1</small></div>
  </div>
  <div class="sp"></div>
  <button class="hbtn" id="btnHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Senarai Soalan</span></button>
  <button class="hbtn" id="btnBoard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="lbl">Papan Tulis</span></button>
  <button class="hbtn" id="zOut" title="Kecilkan tulisan">A−</button>
  <button class="hbtn" id="zIn" title="Besarkan tulisan">A+</button>
  <button class="hbtn gold" id="btnFull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Skrin Penuh</span></button>
</div></header>

<nav class="tools" id="tools" aria-label="Alat anotasi">
  <button class="t on" data-tool="cursor" data-tip="Tetikus — klik jawapan (V / Esc)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
  <button class="t" data-tool="pen" data-tip="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>

<script>
const Q = [
{n:1,t:4,h:"9",tp:"Pentadbiran Kesultanan Melayu Melaka",
q:"Apakah tugas pembesar peringkat jajahan dalam sistem pentadbiran Kesultanan Melayu Melaka?",
o:["Menasihati sultan","Menjaga keamanan","Menjaga keselamatan kota","Menguruskan perbendaharaan"],a:"B",
w:["Tugas pembesar di peringkat <b>pusat</b>, terutamanya Bendahara sebagai penasihat utama sultan.",
"Pembesar jajahan dilantik sultan untuk mentadbir jajahan masing-masing — <b>menjaga keamanan</b> dan memungut cukai di kawasan itu.",
"Tugas <b>Temenggung</b> di peringkat pusat (ketua keselamatan dalam negeri dan kota).",
"Tugas <b>Penghulu Bendahari</b> di peringkat pusat."],
info:{t:"Sistem Pembesar Kesultanan Melayu Melaka",p:[
"<b>Peringkat pusat — Pembesar Empat Lipatan:</b> Bendahara (ketua pentadbir & penasihat sultan), Penghulu Bendahari (perbendaharaan & ketua syahbandar), Temenggung (keselamatan, ketua polis & penjara), Laksamana (ketua angkatan laut & pengiring sultan).",
"<b>Peringkat jajahan/daerah:</b> pembesar dilantik oleh sultan untuk mentadbir kawasan, menjaga keamanan dan memungut cukai.",
"Sistem ini menunjukkan pentadbiran Melaka tersusun dan berhierarki, dengan sultan sebagai pemerintah tertinggi."]},
tip:"Kata kunci <b>“peringkat jajahan”</b> → bukan tugas pembesar pusat. Tolak A, C, D kerana itu tugas Bendahara, Temenggung dan Bendahari."},

{n:2,t:4,h:"10–11",tp:"Undang-undang Melaka",
q:"Terdapat kesalahan yang akan dikenakan hukuman bunuh dalam undang-undang yang diamalkan di Melaka.\nApakah kesalahan tersebut?",
rom:[["Mengenakan cukai tinggi",0,"Bukan kesalahan yang dihukum bunuh dalam undang-undang Melaka."],
["Menipu dalam timbangan",0,"Kesalahan dalam urusan jual beli — tidak dikenakan hukuman bunuh."],
["Mengingkari arahan sultan",1,"Dianggap <b>menderhaka</b> kepada sultan — boleh dihukum bunuh (Hukum Kanun Melaka)."],
["Memberontak di atas kapal",1,"Undang-undang Laut Melaka memberi kuasa kepada nakhoda menjatuhkan hukuman bunuh terhadap pemberontak di atas kapal."]],
o:["I dan II","I dan IV","II dan III","III dan IV"],a:"D",
info:{t:"Undang-undang Kesultanan Melayu Melaka",p:[
"<b>Hukum Kanun Melaka</b> — mengatur kehidupan di darat: tanggungjawab raja & pembesar, pantang larang, hukuman jenayah, hal ehwal keluarga dan perdagangan.",
"<b>Undang-undang Laut Melaka</b> — mengatur pelayaran dan perdagangan laut. Nakhoda berkuasa seperti raja di atas kapal.",
"Undang-undang ini berasaskan hukum Islam dan adat, bertujuan mewujudkan keamanan dan keadilan."]},
tip:"Kenal pasti dulu pernyataan yang <b>pasti betul</b> (III — derhaka). Kemudian cari pilihan jawapan yang mengandungi III — hanya C dan D."},

{n:3,t:4,h:"24",tp:"Idea Nasionalisme di Barat",
q:"Mengapakah John Locke menghasilkan karya <i>Two Treatises of Government</i> yang mempopularkan prinsip raja berperlembagaan?",
o:["Mengabaikan hak rakyat","Menolak raja berkuasa mutlak","Menentang pembinaan negara bangsa","Menghalang pembentukan negara demokrasi"],a:"B",
w:["Bertentangan — Locke <b>memperjuangkan</b> hak rakyat (hak hidup, kebebasan dan harta).",
"Locke berpendapat kuasa pemerintah datang daripada persetujuan rakyat, jadi raja mesti tertakluk kepada undang-undang — beliau <b>menolak pemerintahan raja berkuasa mutlak</b>.",
"Tidak berkaitan — idea Locke malah menyumbang kepada kemunculan nasionalisme dan negara bangsa.",
"Bertentangan — idea Locke menjadi asas kepada sistem demokrasi."],
info:{t:"John Locke & Raja Berperlembagaan",p:[
"John Locke ialah ahli falsafah Inggeris yang menulis <i>Two Treatises of Government</i>.",
"Idea utama: <b>hak semula jadi</b> manusia (hidup, kebebasan, harta) dan kerajaan dibentuk melalui persetujuan rakyat.",
"Raja berperlembagaan = raja memerintah mengikut perlembagaan, bukan sesuka hati. Prinsip ini menjadi asas sistem pemerintahan di banyak negara, termasuk Malaysia."]},
tip:"Soalan “Mengapakah” → cari <b>sebab</b>. Pilihan A, C, D semuanya bersifat negatif dan bertentangan dengan idea Locke."},

{n:4,t:4,h:"37",tp:"Nasionalisme di Tanah Melayu",
q:"Pertubuhan Ikatan Semenanjung Borneo telah melahirkan persatuan",
o:["sederhana","setempat","radikal","revolusi"],a:"C",
w:["Persatuan sederhana/konservatif dipimpin golongan atasan dan berpendidikan Inggeris, contohnya persatuan Melayu negeri.",
"Persatuan setempat merujuk persatuan peringkat negeri — bukan hasil Ikatan Semenanjung Borneo.",
"Ikatan Semenanjung Borneo di Maktab Perguruan Sultan Idris (MPSI) melahirkan <b>Kesatuan Melayu Muda (KMM)</b> — persatuan berhaluan <b>radikal</b>.",
"Bukan istilah pengelasan persatuan dalam buku teks."],
info:{t:"Ikatan Semenanjung Borneo → KMM",p:[
"Ditubuhkan secara rahsia oleh <b>Ibrahim Haji Yaacob</b> dan rakan-rakan di MPSI, Tanjung Malim.",
"Dipengaruhi semangat nasionalisme Indonesia.",
"Menjadi asas kepada penubuhan <b>Kesatuan Melayu Muda (KMM)</b> pada 1938 — berhaluan kiri/radikal, menentang penjajah British dan memperjuangkan konsep Melayu Raya."]},
tip:"Kaitkan: MPSI → Ibrahim Yaacob → KMM → <b>radikal</b>."},

{n:5,t:4,h:"60",tp:"Perang Dunia Kedua",
q:"Jerman melancarkan Operasi Barbarossa bagi menawan Rusia.\nBagaimanakah operasi tersebut dilakukan?",
o:["Gerakan gerila","Operasi secara kilat","Tindakan secara rahsia","Serangan besar-besaran"],a:"D",
w:["Gerila ialah taktik pasukan kecil yang menyerang hendap, bukan kaedah tentera Jerman dalam operasi ini.",
"<b>Pengecoh!</b> Jerman memang terkenal dengan taktik perang kilat (blitzkrieg) ke atas Poland dan Eropah Barat, tetapi ciri utama Barbarossa yang ditekankan ialah skala serangannya.",
"Operasi Barbarossa ialah serangan ketenteraan terbuka secara besar-besaran, bukan tindakan rahsia.",
"Jerman mengerahkan <b>berjuta-juta tentera</b> menyerang Kesatuan Soviet di sepanjang barisan hadapan yang sangat panjang — <b>serangan besar-besaran</b>."],
info:{t:"Operasi Barbarossa (1941)",p:[
"Dilancarkan oleh Jerman pada <b>22 Jun 1941</b> untuk menawan Kesatuan Soviet (Rusia).",
"Jerman melanggar Pakatan Tidak Menyerang Jerman–Soviet yang ditandatangani pada 1939.",
"Serangan gagal mencapai matlamat akibat musim sejuk yang teruk dan tentangan hebat tentera Soviet — menjadi titik perubahan Perang Dunia Kedua di Eropah."]},
tip:"Bincang dengan murid beza <b>B</b> dan <b>D</b> — inilah jenis pengecoh yang selalu memerangkap calon."},

{n:6,t:4,h:"84",tp:"Bintang Tiga & Penentangan Orang Melayu",
q:"Gangguan Bintang Tiga dalam urusan keagamaan di surau dan masjid telah menimbulkan kemarahan orang Melayu.\nBagaimanakah orang Melayu bertindak mengatasi gangguan tersebut?",
o:["Membentuk Gerakan Fi-Sabilillah","Memperkenalkan Giyu Gun","Melancarkan Gerakan Islah","Menyertai Pan-Islamisme"],a:"A",
w:["Orang Melayu bangkit menentang Bintang Tiga melalui <b>Gerakan Fi-Sabilillah</b> (Tentera Selendang Merah) yang dipimpin oleh Kiyai Salleh di Batu Pahat, Johor.",
"Giyu Gun ialah pasukan tentera sukarela yang ditubuhkan oleh <b>Jepun</b>, bukan tindakan menentang Bintang Tiga.",
"Gerakan Islah ialah gerakan pembaharuan Islam (Kaum Muda) pada awal abad ke-20 — tiada kaitan dengan Bintang Tiga.",
"Pan-Islamisme ialah idea perpaduan umat Islam sedunia — bukan tindakan menentang Bintang Tiga."],
info:{t:"Bintang Tiga (selepas Jepun menyerah, 1945)",p:[
"Selepas Jepun menyerah kalah, berlaku kekosongan kuasa sebelum British kembali. Bintang Tiga (MPAJA) mengambil alih beberapa kawasan.",
"Mereka bertindak kejam, menghukum mereka yang dianggap bekerjasama dengan Jepun, dan mengganggu urusan agama.",
"Tindakan ini mencetuskan pertelingkahan kaum, dan orang Melayu bangkit menentang melalui Gerakan Fi-Sabilillah."]},
tip:"Soalan “Bagaimanakah orang Melayu <b>bertindak</b>” → cari tindakan <b>orang Melayu</b>. Giyu Gun = Jepun, terus tolak."},

{n:7,t:4,h:"94",tp:"British Military Administration (BMA)",
q:"Mengapakah British Military Administration (BMA) diperkenalkan di Tanah Melayu?",
o:["Mengembalikan kestabilan","Memberi latihan ketenteraan","Menentang pendudukan Jepun","Menyokong kepulangan British"],a:"A",
w:["BMA diperkenalkan untuk <b>memulihkan keamanan dan kestabilan</b> selepas perang — mengawal huru-hara, membekalkan makanan dan memulihkan ekonomi.",
"Bukan tujuan BMA.",
"Jepun telah menyerah kalah sebelum BMA diperkenalkan.",
"BMA itu sendiri ialah pentadbiran British — tiada keperluan “menyokong” kepulangan British."],
info:{t:"BMA (September 1945 – 1 April 1946)",p:[
"Pentadbiran tentera British sementara di Tanah Melayu selepas Jepun menyerah kalah.",
"Tugas: memulihkan keamanan, melucutkan senjata, membekalkan makanan dan memulihkan ekonomi.",
"Pentadbiran ini dikritik kerana masalah rasuah dan pasaran gelap. BMA ditamatkan apabila Malayan Union diperkenalkan."]},
tip:"Fikir <b>tujuan</b> pentadbiran tentera selepas perang → memulihkan keadaan."},

{n:8,t:4,h:"113",tp:"Penyerahan Sarawak kepada British",
q:"Mengapakah rakyat tempatan menyokong penyerahan Sarawak kepada British?",
rom:[["Menubuhkan parti politik",0,"Bukan alasan menyokong penyerahan."],
["Menuntut kenaikan pangkat",0,"Bukan alasan menyokong penyerahan."],
["Meningkatkan taraf hidup",1,"Golongan penyokong percaya British mampu meningkatkan taraf hidup selepas kemusnahan perang."],
["Memajukan negeri",1,"British dianggap mempunyai kewangan dan kepakaran untuk memajukan Sarawak."]],
o:["I dan II","I dan IV","II dan III","III dan IV"],a:"D",
info:{t:"Penyerahan Sarawak (1946)",p:[
"Rajah Vyner Brooke menyerahkan Sarawak kepada British pada <b>1 Julai 1946</b>; Sarawak menjadi Tanah Jajahan Mahkota British.",
"<b>Golongan menyokong:</b> percaya British boleh membangunkan negeri dan meningkatkan taraf hidup rakyat.",
"<b>Golongan menentang:</b> Gerakan Antipenyerahan — contohnya Persatuan Kebangsaan Melayu Sarawak dan Barisan Pemuda Sarawak. Rosli Dhobi membunuh Gabenor Duncan Stewart pada 1949."]},
tip:"Alasan “menyokong” mestilah sesuatu yang memberi manfaat kepada rakyat dan negeri."},

{n:9,t:4,h:"130",tp:"Perlembagaan Rakyat (PUTERA–AMCJA)",
q:"Maklumat berikut berkaitan dengan cadangan PUTERA dan AMCJA.\nApakah kandungan perlembagaan tersebut?",
stim:{k:"box",txt:"Perlembagaan Rakyat"},
o:["Majlis Raja-Raja dibentuk","Warganegara dinamakan Melayu","Kedudukan istimewa orang Melayu","Penubuhan Dewan Undangan Negeri"],a:"B",
w:["Majlis Raja-Raja dikaitkan dengan Perjanjian Persekutuan Tanah Melayu 1948, bukan ciri utama Perlembagaan Rakyat.",
"Ciri paling menonjol Perlembagaan Rakyat ialah <b>kerakyatan/warganegara dinamakan “Melayu”</b>.",
"Kedudukan istimewa orang Melayu dijamin secara rasmi melalui Perjanjian Persekutuan 1948 dan Perlembagaan 1957 — bukan jawapan paling tepat di sini.",
"Struktur pentadbiran negeri ditetapkan dalam Persekutuan 1948, bukan kandungan Perlembagaan Rakyat."],
info:{t:"PUTERA–AMCJA & Perlembagaan Rakyat (1947)",p:[
"<b>PUTERA</b> (Pusat Tenaga Rakyat) — gabungan pertubuhan Melayu berhaluan kiri. <b>AMCJA</b> (All-Malaya Council of Joint Action) — dipimpin Tan Cheng Lock.",
"Kedua-duanya bergabung menentang cadangan Persekutuan Tanah Melayu dan mengemukakan <b>Perlembagaan Rakyat</b>.",
"Antara kandungan: Singapura disatukan dengan Tanah Melayu, kerakyatan sama rata, warganegara dinamakan Melayu, bahasa Melayu sebagai bahasa rasmi.",
"Perlembagaan ini ditolak oleh British."]},
tip:"Ingat ciri unik: <b>“Melayu” sebagai nama kerakyatan</b> — ini yang membezakan Perlembagaan Rakyat."},

{n:10,t:4,h:"136",tp:"Persekutuan Tanah Melayu 1948",
q:"Pesuruhjaya Tinggi British perlu memastikan raja dirujuk dalam perkara berkaitan kuasa kerajaan Persekutuan.\nMengapakah perkara tersebut perlu dilakukan?",
o:["Kerjasama antara pemimpin","Melakukan pembahagian kuasa","Kedudukan raja dikembalikan","Mengiktiraf hak penduduk"],a:"C",
w:["Tidak menjelaskan sebab raja perlu dirujuk.",
"Pembahagian kuasa ialah ciri sistem persekutuan, tetapi bukan sebab raja dirujuk.",
"Persekutuan 1948 <b>mengembalikan kedaulatan dan kedudukan Raja-Raja Melayu</b> yang dihapuskan oleh Malayan Union — sebab itu raja mesti dirujuk.",
"Tidak berkaitan dengan peranan raja."],
info:{t:"Perjanjian Persekutuan Tanah Melayu 1948",p:[
"Berkuat kuasa <b>1 Februari 1948</b>, menggantikan Malayan Union yang ditentang hebat oleh orang Melayu.",
"Kedaulatan Raja-Raja Melayu dikembalikan; Pesuruhjaya Tinggi British mengetuai kerajaan persekutuan.",
"Ditubuhkan Majlis Raja-Raja, Majlis Mesyuarat Kerja dan Majlis Perundangan Persekutuan. Syarat kerakyatan diperketat."]},
tip:"Kaitkan dengan latar: Malayan Union menghapuskan kuasa raja → Persekutuan 1948 <b>mengembalikannya</b>."},

{n:11,t:4,h:"150",tp:"Ancaman Komunis & Darurat",
q:"Keratan akhbar berikut menunjukkan keganasan yang dilakukan oleh komunis di Tanah Melayu.\nMengapakah mereka bertindak sedemikian?",
stim:{k:"img",src:"q11",cap:"Keratan akhbar: “Pengganas Serang Kampung”",w:260},
o:["Menyekat hubungan luar","Memimpin gerakan radikal","Menubuhkan negara demokrasi","Mengancam keselamatan rakyat"],a:"D",
w:["Bukan matlamat keganasan komunis.",
"Tidak tepat — keganasan itu bukan untuk memimpin gerakan radikal.",
"Bertentangan — PKM mahu menubuhkan <b>negara komunis</b>, bukan demokrasi.",
"Komunis menyerang kampung, balai polis dan ladang untuk <b>menakutkan dan mengancam keselamatan rakyat</b> supaya rakyat tunduk dan menyokong mereka."],
info:{t:"Darurat 1948–1960",p:[
"Parti Komunis Malaya (PKM) mahu menubuhkan Republik Komunis Malaya melalui perjuangan bersenjata.",
"Pembunuhan tiga pengurus ladang Eropah di Sungai Siput, Perak pada <b>Jun 1948</b> membawa kepada pengisytiharan darurat.",
"Taktik PKM: membunuh, membakar, menyerang kampung dan balai polis, serta mengugut penduduk."]},
tip:"Lihat tajuk akhbar — <b>“Pengganas Serang Kampung”</b> → mangsa ialah rakyat."},

{n:12,t:4,h:"160",tp:"Rundingan Baling",
q:"Maklumat berikut berkaitan dengan usaha menangani ancaman komunis.\nApakah tuntutan Tunku Abdul Rahman dalam rundingan tersebut?",
stim:{k:"box",txt:"Rundingan Baling"},
o:["Meletakkan senjata","Membayar pampasan","Mengukuhkan pertahanan","Mempercepatkan kemerdekaan"],a:"A",
w:["Tunku menuntut PKM <b>meletakkan senjata, menyerah diri</b> dan membubarkan parti.",
"Tiada tuntutan pampasan.",
"Bukan tuntutan kepada pihak komunis.",
"<b>Pengecoh!</b> Kegagalan rundingan membantu meyakinkan British tentang ketegasan Tunku dan mempercepat kemerdekaan, tetapi itu <b>kesan</b>, bukan tuntutan."],
info:{t:"Rundingan Baling (28–29 Disember 1955)",p:[
"Diadakan di Baling, Kedah.",
"Wakil kerajaan: Tunku Abdul Rahman, Tan Cheng Lock dan David Marshall (Ketua Menteri Singapura). Wakil PKM: Chin Peng, Chen Tien dan Rashid Maidin.",
"PKM mahu parti mereka diiktiraf sah — Tunku menolak. Rundingan <b>gagal</b>."]},
tip:"Bezakan <b>tuntutan</b> (apa yang diminta semasa rundingan) dengan <b>kesan</b> (apa yang berlaku selepas)."},

{n:13,t:4,h:"174",tp:"Jawatankuasa Hubungan Antara Kaum (CLC)",
q:"Bagaimanakah Jawatankuasa Hubungan Antara Kaum (CLC) menyelesaikan masalah ketegangan kaum di Tanah Melayu?",
o:["Menuntut kemerdekaan","Mengadakan perjanjian","Menjalankan rundingan","Menguatkuasa undang-undang"],a:"C",
w:["Bukan cara CLC menangani ketegangan kaum.",
"CLC tidak menandatangani perjanjian rasmi.",
"CLC mengumpulkan pemimpin pelbagai kaum untuk <b>berbincang dan berunding</b> bagi mencari persefahaman.",
"CLC bukan badan penguat kuasa undang-undang."],
info:{t:"CLC – Communities Liaison Committee (1949)",p:[
"Dicadangkan oleh Malcolm MacDonald, Pesuruhjaya Agung British di Asia Tenggara.",
"Dianggotai pemimpin pelbagai kaum seperti Dato' Onn Jaafar dan Tan Cheng Lock.",
"Membincangkan isu kerakyatan, ekonomi orang Melayu, pendidikan dan politik — permulaan semangat <b>tolak ansur dan kerjasama antara kaum</b>."]},
tip:"Nama “Jawatankuasa <b>Hubungan</b>” sudah memberi petunjuk — ia medium <b>perbincangan</b>."},

{n:14,t:4,h:"179",tp:"Sistem Ahli 1951",
q:"Tokoh berikut merupakan ahli Hal Ehwal Dalam Negeri Persekutuan Tanah Melayu.\nApakah tanggungjawab beliau?",
stim:{k:"img",src:"q14",cap:"Ahli Hal Ehwal Dalam Negeri",w:200},
o:["Pembinaan hospital","Pendaftaran kerakyatan","Pembangunan pendidikan","Perancangan bandar"],a:"B",
w:["Tanggungjawab Ahli Kesihatan.",
"Portfolio Hal Ehwal Dalam Negeri menguruskan urusan dalam negeri termasuk <b>pendaftaran kerakyatan</b>.",
"Tanggungjawab Ahli Pendidikan.",
"Tanggungjawab Ahli Kerajaan Tempatan, Perumahan dan Perancangan Bandar."],
info:{t:"Sistem Ahli (1951)",p:[
"Diperkenalkan oleh Pesuruhjaya Tinggi Sir Henry Gurney — pemimpin tempatan diberi portfolio seperti menteri.",
"Tujuan: memberi <b>latihan pentadbiran</b> kepada pemimpin tempatan sebagai persediaan berkerajaan sendiri.",
"Antara ahli: Dato' Onn Jaafar (Hal Ehwal Dalam Negeri), Dr. Lee Tiang Keng (Kesihatan), E.E.C. Thuraisingham (Pendidikan), Dato' Nik Ahmad Kamil (Kerajaan Tempatan, Perumahan & Perancangan Bandar)."]},
tip:"Padankan <b>portfolio</b> dengan tugasnya. Pilihan A, C, D ialah tugas ahli lain dalam Sistem Ahli."},

{n:15,t:4,h:"203",tp:"Pilihan Raya di Sabah",
q:"Parti politik yang bertanding dalam pilihan raya awal di Sabah ialah",
o:["USNO","UMNO","PANAS","SUPP"],a:"A",
w:["<b>USNO</b> (United Sabah National Organisation) dipimpin Tun Datu Mustapha — antara parti terawal di Sabah.",
"UMNO ialah parti di Tanah Melayu pada masa itu.",
"PANAS (Parti Negara Sarawak) ialah parti di <b>Sarawak</b>.",
"SUPP (Sarawak United People's Party) ialah parti di <b>Sarawak</b>."],
info:{t:"Parti politik awal di Sabah & Sarawak",p:[
"<b>Sabah:</b> USNO (Tun Datu Mustapha), UNKO (Donald Stephens), Pasok Momogun.",
"<b>Sarawak:</b> SUPP, PANAS, BARJASA, SNAP.",
"Pilihan raya awal di Sabah ialah pilihan raya kerajaan tempatan, sebelum pembentukan Malaysia."]},
tip:"Buat jadual kecil: parti <b>Sabah</b> vs parti <b>Sarawak</b> — mudah menolak pengecoh."},

{n:16,t:4,h:"207",tp:"Pilihan Raya Umum 1955",
q:"Apakah tanggungjawab Tunku Abdul Rahman selaku Ketua Menteri?",
o:["Mencapai kemerdekaan","Membina bangsa bersatu","Meningkatkan mutu kesihatan","Menguruskan perbendaharaan negara"],a:"A",
w:["Selepas Perikatan menang PRU 1955, tanggungjawab utama Tunku ialah <b>memperjuangkan kemerdekaan</b> seperti dijanjikan dalam manifesto.",
"Matlamat jangka panjang negara, bukan tanggungjawab khusus Ketua Menteri ketika itu.",
"Tugas portfolio kesihatan.",
"Tugas portfolio kewangan."],
info:{t:"PRU Persekutuan 1955",p:[
"Diadakan pada <b>27 Julai 1955</b>. Parti Perikatan menang 51 daripada 52 kerusi.",
"Tunku Abdul Rahman dilantik sebagai <b>Ketua Menteri</b> Persekutuan Tanah Melayu yang pertama.",
"Rombongan ke London (1956) membawa kepada persetujuan kemerdekaan — dicapai pada <b>31 Ogos 1957</b>."]},
tip:"Kaitkan dengan manifesto Perikatan 1955 → <b>kemerdekaan</b>."},

{n:17,t:4,h:"222",tp:"Suruhanjaya Reid",
q:"Raja-raja Melayu telah mengemukakan memorandum bertulis kepada Suruhanjaya Reid.\nApakah kandungan memorandum tersebut?",
o:["Menubuhkan Majlis Raja-Raja","Menentang kewarganegaraan terbuka","Melindungi hak istimewa orang Melayu","Mencadangkan sekolah kebangsaan"],a:"C",
w:["Majlis Raja-Raja telah pun wujud sejak 1948.",
"Bukan kandungan memorandum Raja-Raja Melayu.",
"Raja-Raja Melayu mahu <b>hak istimewa orang Melayu</b> dilindungi dalam perlembagaan, selain kedudukan raja dan agama Islam.",
"Berkaitan dasar pendidikan (Laporan Razak), bukan memorandum Raja-Raja."],
info:{t:"Suruhanjaya Reid (1956)",p:[
"Dipengerusikan oleh <b>Lord Reid</b>; ahli lain dari Britain, Australia, India dan Pakistan.",
"Tugas: menggubal perlembagaan Persekutuan Tanah Melayu merdeka.",
"Menerima <b>131 memorandum</b>, termasuk daripada Raja-Raja Melayu dan Parti Perikatan."]},
tip:"Fikir dari sudut <b>siapa</b> yang menghantar — Raja-Raja Melayu → melindungi kedudukan orang Melayu."},

{n:18,t:4,h:"224",tp:"Kerakyatan dalam Perlembagaan 1957",
q:"Rajah berikut berkaitan Perjanjian Persekutuan Tanah Melayu 1957.\nApakah X?",
stim:{k:"list",title:"Jenis Kerakyatan",items:["Penguatkuasaan undang-undang","Permohonan","X"]},
o:["Jus soli","Naturalisasi","Perkahwinan","Penduduk asal"],a:"B",
w:["Jus soli ialah <b>prinsip</b> (kerakyatan berdasarkan tempat lahir) yang terkandung di bawah kuat kuasa undang-undang — bukan jenis yang berasingan.",
"<b>Naturalisasi</b> ialah salah satu cara memperoleh kerakyatan — bagi mereka yang bermastautin lama, berkelakuan baik dan berikrar taat setia.",
"Perkahwinan termasuk dalam kategori pendaftaran/permohonan.",
"Bukan kategori kerakyatan."],
info:{t:"Cara memperoleh kerakyatan",p:[
"<b>Kuat kuasa undang-undang</b> — layak secara automatik (cth. lahir di Tanah Melayu selepas merdeka).",
"<b>Pendaftaran/permohonan</b> — memohon setelah memenuhi syarat tertentu.",
"<b>Naturalisasi</b> — syarat: bermastautin dalam tempoh tertentu, berkelakuan baik, boleh berbahasa Melayu dan bersumpah taat setia.",
"Perlembagaan Malaysia kemudian menambah cara <b>percantuman wilayah</b>."]},
tip:"Hafal tiga jenis: <b>kuat kuasa undang-undang – pendaftaran – naturalisasi</b>."},

{n:19,t:4,h:"244",tp:"Rancangan Buku Merah",
q:"Apakah kepentingan rancangan Buku Merah kepada negara?",
o:["Merekod catuan makanan","Mencatat pengeluaran petani","Menggalakkan rakyat menabung","Melaksanakan projek pembangunan"],a:"D",
w:["Catuan makanan berkaitan strategi zaman Darurat.",
"Bukan fungsi Buku Merah.",
"Bukan fungsi Buku Merah.",
"Buku Merah menyenaraikan dan memantau <b>projek pembangunan luar bandar</b> setiap daerah — jalan, sekolah, klinik, bekalan air."],
info:{t:"Rancangan Buku Merah (1960)",p:[
"Diperkenalkan oleh <b>Tun Abdul Razak</b> selaku Menteri Pembangunan Luar Bandar.",
"Setiap daerah mempunyai “Buku Merah” yang mengandungi peta dan senarai projek pembangunan.",
"Dilengkapi <b>Bilik Gerakan</b> untuk memantau kemajuan — mempercepat pelaksanaan projek dan mengurangkan kerenah birokrasi."]},
tip:"Buku Merah = <b>pembangunan luar bandar</b>. Buku Hijau = <b>pertanian/makanan</b>. Jangan keliru!"},

{n:20,t:4,h:"246",tp:"Konsep Kedaulatan",
q:"Negara yang merdeka adalah negara yang mempunyai kedaulatan.\nApakah maksud daulat?",
o:["Kekuasaan tertinggi","Keselamatan negara","Kecemerlangan hidup","Keunggulan pendidikan"],a:"A",
w:["<b>Daulat</b> bermaksud <b>kekuasaan tertinggi</b> — negara berdaulat bebas menentukan hala tuju sendiri tanpa campur tangan kuasa asing.",
"Keselamatan ialah hasil daripada kedaulatan, bukan maksudnya.",
"Tidak berkaitan maksud daulat.",
"Tidak berkaitan maksud daulat."],
info:{t:"Daulat & Kedaulatan",p:[
"<b>Daulat</b> = kekuasaan tertinggi. Dalam tradisi Melayu, daulat dikaitkan dengan raja.",
"Negara berdaulat bebas daripada kawalan kuasa asing dalam pentadbiran, ekonomi dan dasar luar.",
"Kedaulatan Malaysia dilambangkan oleh Yang di-Pertuan Agong dan Raja-Raja Melayu."]},
tip:"Soalan definisi — jawab dengan <b>maksud</b>, bukan kesan."},

{n:21,t:5,h:"7",tp:"Kedaulatan Negara",
q:"Maklumat berikut berkaitan jenis kedaulatan.\nApakah X?",
stim:{k:"table2",left:"Undang-undang",items:["Menjamin keadilan","Mewujudkan keamanan","X"]},
o:["Memperkukuhkan jati diri","Meningkatkan kerjasama luar","Membina masyarakat progresif","Memastikan kestabilan negara"],a:"D",
w:["Lebih berkaitan aspek jati diri bangsa seperti bahasa dan budaya.",
"Berkaitan dasar luar negara.",
"Matlamat Rukun Negara.",
"Undang-undang yang berdaulat menjamin keadilan, mewujudkan keamanan dan <b>memastikan kestabilan negara</b>."],
info:{t:"Kedaulatan Undang-undang",p:[
"<b>Perlembagaan Persekutuan</b> ialah undang-undang tertinggi negara.",
"Semua rakyat dan pemerintah tertakluk kepada undang-undang.",
"Kesan: keadilan terjamin, keamanan wujud dan negara stabil — membolehkan pembangunan dilaksanakan."]},
tip:"Lihat corak dua item lain (keadilan, keamanan) — X juga mesti <b>kesan kepada negara</b>."},

{n:22,t:5,h:"11",tp:"Kedaulatan & Semangat Patriotisme",
q:"Gambar menunjukkan pasukan bola sepak negara yang berjaya melayakkan diri ke Sukan Olimpik 1972.\nApakah faktor kejayaan tersebut?",
stim:{k:"img",src:"q22",cap:"Pasukan bola sepak negara, 1972",w:520},
o:["Prasarana sukan","Bayaran insentif tinggi","Semangat perpaduan bangsa","Mengukuhkan kedudukan negara"],a:"C",
w:["Tidak ditonjolkan sebagai faktor kejayaan.",
"Tidak tepat.",
"Pemain pelbagai kaum bermain atas nama negara dengan <b>semangat perpaduan</b> — faktor utama kejayaan.",
"<b>Pengecoh!</b> Ini <b>kesan</b> kejayaan, bukan faktornya."],
info:{t:"Malaysia di Sukan Olimpik",p:[
"Pasukan bola sepak Malaysia layak ke <b>Sukan Olimpik Munich 1972</b>.",
"Malaysia turut layak ke Sukan Olimpik Moscow 1980 tetapi tidak menyertainya kerana boikot.",
"Kejayaan sukan antarabangsa mengangkat nama negara dan memupuk semangat patriotisme."]},
tip:"Bezakan <b>faktor</b> (sebab berjaya) dengan <b>kesan</b> (hasil kejayaan)."},

{n:23,t:5,h:"24",tp:"Sejarah Undang-undang",
q:"Maklumat berikut berkaitan undang-undang yang diperkenalkan oleh British di Negeri-negeri Selat.\nMengapakah undang-undang tersebut diperkenalkan?",
stim:{k:"box",txt:"<i>Charter of Justice</i>"},
o:["Menjimatkan kos","Melindungi penduduk","Melicinkan pentadbiran","Memajukan perdagangan"],a:"B",
w:["Bukan tujuan undang-undang ini.",
"Charter of Justice memperkenalkan sistem mahkamah dan undang-undang Inggeris bagi menegakkan keadilan dan <b>melindungi penduduk</b>.",
"Mungkin kesan sampingan, tetapi tujuan utama undang-undang ialah keadilan dan perlindungan penduduk.",
"Tidak berkaitan secara langsung."],
info:{t:"Charter of Justice (Piagam Keadilan)",p:[
"<b>Piagam Keadilan Pertama (1807)</b> — memperkenalkan undang-undang Inggeris dan mahkamah di Pulau Pinang.",
"<b>Piagam Keadilan Kedua (1826)</b> — diluaskan ke seluruh Negeri-negeri Selat (Pulau Pinang, Melaka, Singapura).",
"Menjadi asas kepada sistem perundangan moden di negara kita."]},
tip:"Undang-undang = <b>keadilan & perlindungan</b>. Pilih jawapan yang menyentuh rakyat."},

{n:24,t:5,h:"31",tp:"Pindaan Perlembagaan 1963",
q:"Perlembagaan negara telah dipinda semasa pembentukan Malaysia pada tahun 1963.\nApakah kesan pindaan tersebut?",
o:["Pemisahan Singapura","Penggabungan wilayah","Pembukaan pasaran bersama","Pengurangan kerusi parlimen"],a:"B",
w:["Berlaku pada 9 Ogos 1965 — pindaan yang berbeza.",
"Pindaan 1963 membolehkan <b>penggabungan wilayah</b> Sabah, Sarawak dan Singapura ke dalam Persekutuan Malaysia.",
"Bukan kesan pindaan perlembagaan.",
"Sebaliknya, jumlah kerusi Parlimen <b>bertambah</b> dengan kemasukan wilayah baharu."],
info:{t:"Pembentukan Malaysia 1963",p:[
"Perjanjian Malaysia ditandatangani di London pada <b>9 Julai 1963</b>; Malaysia dibentuk pada <b>16 September 1963</b>.",
"Perlembagaan Persekutuan Tanah Melayu dipinda menjadi Perlembagaan Malaysia.",
"Sabah dan Sarawak diberi perlindungan hak khas mengikut perjanjian yang dipersetujui."]},
tip:"Perhatikan <b>tahun</b>: 1963 = bergabung; 1965 = Singapura berpisah."},

{n:25,t:5,h:"44",tp:"Majlis Raja-Raja",
q:"Antara yang berikut, yang manakah fungsi Majlis Raja-Raja?",
rom:[["Mengisytiharkan darurat",0,"Kuasa <b>Yang di-Pertuan Agong</b> (Perkara 150)."],
["Melantik diplomat Malaysia",0,"Dilantik oleh <b>Yang di-Pertuan Agong</b> atas nasihat Perdana Menteri."],
["Memilih Yang di-Pertuan Agong",1,"Fungsi utama Majlis Raja-Raja — memilih YDPA dan Timbalan YDPA."],
["Menjadi Lembaga Pengampunan",1,"Disenaraikan sebagai fungsi Majlis Raja-Raja dalam buku teks."]],
o:["I dan II","I dan IV","II dan III","III dan IV"],a:"D",
info:{t:"Majlis Raja-Raja",p:[
"Dianggotai oleh Raja-Raja Melayu dan Yang di-Pertua Negeri.",
"Fungsi: memilih Yang di-Pertuan Agong dan Timbalan YDPA, memberi persetujuan berkaitan undang-undang tertentu dan keistimewaan raja, serta urusan agama Islam.",
"Yang di-Pertua Negeri tidak terlibat dalam pemilihan YDPA dan urusan berkaitan agama Islam serta keistimewaan Raja-Raja."]},
tip:"Bezakan kuasa <b>YDPA</b> (darurat, lantikan) dengan fungsi <b>Majlis Raja-Raja</b> (memilih YDPA)."},

{n:26,t:5,h:"51",tp:"Kebebasan Asasi",
q:"Maklumat berikut berkaitan amalan kebebasan asasi berdasarkan Perlembagaan Persekutuan.\nApakah tujuan sekatan tersebut?",
stim:{k:"box",txt:"Kebebasan asasi masih tertakluk kepada sekatan undang-undang yang digubal oleh Parlimen"},
o:["Menjamin kesejahteraan","Menyesuaikan situasi semasa","Memajukan sistem perundangan","Memantapkan pentadbiran negara"],a:"A",
w:["Sekatan dibuat demi keselamatan, ketenteraman awam dan moral — untuk <b>menjamin kesejahteraan</b> rakyat dan negara.",
"Tidak menjelaskan tujuan sekatan.",
"Bukan tujuan sekatan.",
"Bukan tujuan sekatan."],
info:{t:"Kebebasan Asasi (Perkara 5–13)",p:[
"Antaranya: kebebasan diri, kesamarataan, bergerak, bercakap, berhimpun, berpersatuan, beragama, hak pendidikan dan hak terhadap harta.",
"Kebebasan ini <b>tidak mutlak</b> — Parlimen boleh membuat sekatan.",
"Tujuan sekatan: keselamatan negara, ketenteraman awam, moral dan menjaga keharmonian masyarakat."]},
tip:"Kebebasan + sekatan → supaya kebebasan seseorang <b>tidak menjejaskan orang lain</b>."},

{n:27,t:5,h:"68",tp:"Sistem Persekutuan",
q:"Mengapakah pembahagian kuasa antara Kerajaan Persekutuan dengan Kerajaan Negeri dilaksanakan di negara kita?",
rom:[["Memajukan negara",1,"Pembahagian kuasa membolehkan pembangunan dirancang dengan teratur."],
["Menjamin kestabilan",1,"Mengelakkan pertindihan dan pertelingkahan kuasa → negara stabil."],
["Menjayakan integrasi nasional",0,"Bukan tujuan utama pembahagian kuasa mengikut skema."],
["Memperkukuhkan pakatan politik",0,"Tidak berkaitan."]],
o:["I dan II","I dan IV","II dan III","III dan IV"],a:"A",
info:{t:"Pembahagian Kuasa (Jadual Kesembilan)",p:[
"<b>Senarai Persekutuan</b> — cth. pertahanan, hal ehwal luar negeri, pendidikan, kewangan.",
"<b>Senarai Negeri</b> — cth. tanah, agama Islam, kerajaan tempatan.",
"<b>Senarai Bersama</b> — cth. kebajikan masyarakat, biasiswa, perancangan bandar.",
"Tujuan: pentadbiran teratur, mengelak pertindihan kuasa, menjamin kestabilan dan kemajuan negara."]},
tip:"Pernyataan III nampak baik, tetapi kaitan <b>langsung</b> pembahagian kuasa ialah pentadbiran → kemajuan & kestabilan."},

{n:28,t:5,h:"73",tp:"Wilayah Ekonomi / Koridor",
q:"Senarai berikut berkaitan rancangan pembangunan sosioekonomi di negara kita.\nApakah matlamat rancangan tersebut?",
stim:{k:"list",title:null,items:["Wilayah Ekonomi Koridor Utara (NCER)","Wilayah Ekonomi Pantai Timur (ECER)"]},
o:["Pembukaan tanah baharu","Pembangunan ekonomi segi tiga","Pelaksanaan projek pembangunan","Pemulihan tanah terbiar"],a:"C",
w:["Berkaitan agensi seperti FELDA.",
"Merujuk kerjasama serantau (cth. SIJORI, IMT-GT) — bukan wilayah ekonomi dalam negara.",
"Wilayah ekonomi bertujuan <b>melaksanakan projek pembangunan</b> secara bersepadu untuk merapatkan jurang pembangunan antara wilayah.",
"Berkaitan agensi seperti FELCRA."],
info:{t:"Koridor Pembangunan Wilayah",p:[
"Diperkenalkan di bawah <b>Rancangan Malaysia Kesembilan</b>.",
"Wilayah: Iskandar Malaysia (Johor), NCER, ECER, Koridor Pembangunan Sabah (SDC) dan Koridor Tenaga Diperbaharui Sarawak (SCORE).",
"Matlamat: menarik pelaburan, mewujudkan peluang pekerjaan dan mengimbangi pembangunan antara wilayah."]},
tip:"“Koridor/wilayah ekonomi” = <b>projek pembangunan</b> di kawasan tertentu dalam negara."},

{n:29,t:5,h:"92",tp:"Konsep Melayu Raya",
q:"Konsep Melayu Raya telah diperjuangkan oleh nasionalis di Tanah Melayu sehingga Perang Dunia Kedua.\nMengapakah konsep tersebut gagal dilaksanakan?",
o:["Pelaksanaan Malayan Union","Penentangan Parti Komunis Malaya","Penubuhan Institut Latihan Pemimpin","Pengisytiharan kemerdekaan Indonesia"],a:"D",
w:["Malayan Union diperkenalkan pada 1946 — selepas konsep Melayu Raya gagal.",
"Bukan sebab utama kegagalan.",
"Bukan sebab kegagalan.",
"Indonesia mengisytiharkan kemerdekaan pada <b>17 Ogos 1945</b> tanpa melibatkan Tanah Melayu — rancangan penyatuan terbatal."],
info:{t:"Konsep Melayu Raya",p:[
"Idea menyatukan Tanah Melayu dengan Indonesia sebagai satu negara.",
"Diperjuangkan oleh <b>Kesatuan Melayu Muda (KMM)</b> yang dipimpin Ibrahim Haji Yaacob, dan dibincangkan dengan pemimpin Indonesia.",
"Gagal apabila Jepun menyerah kalah dan Sukarno–Hatta mengisytiharkan kemerdekaan Indonesia sahaja."]},
tip:"Perhatikan garis masa — sebab kegagalan mesti berlaku <b>pada 1945</b>."},

{n:30,t:5,h:"106",tp:"Konfrontasi Indonesia",
q:"Pembentukan Malaysia telah mendapat tentangan daripada Indonesia.\nBagaimanakah tentangan tersebut dilakukan?",
o:["Melancarkan serangan gerila","Menutup pintu sempadan","Menghantar bantahan rasmi","Menolak perjanjian normalisasi"],a:"A",
w:["Indonesia melancarkan Konfrontasi — <b>menyusup dan melakukan serangan gerila</b> di Sabah, Sarawak dan Semenanjung.",
"Tidak tepat.",
"Tidak menggambarkan bentuk tentangan Konfrontasi.",
"Bertentangan — perjanjian normalisasi pada 1966 <b>menamatkan</b> Konfrontasi."],
info:{t:"Konfrontasi Indonesia–Malaysia (1963–1966)",p:[
"Dilancarkan oleh Presiden Sukarno dengan slogan “Ganyang Malaysia”.",
"Tentera Indonesia menyusup ke Sabah dan Sarawak serta mendarat di Semenanjung, contohnya di Johor.",
"Berakhir dengan perjanjian normalisasi hubungan yang ditandatangani pada <b>11 Ogos 1966</b>."]},
tip:"Konfrontasi = konflik <b>bersenjata</b>. Pilih tindakan ketenteraan."},

{n:31,t:5,h:"117",tp:"Pendidikan di Sabah & Sarawak",
q:"Bagaimanakah sistem pendidikan di Sarawak dan Sabah dimajukan selepas pembentukan Malaysia?",
o:["Memberi latihan perguruan","Memperkenalkan biasiswa","Menubuhkan tabung pelajaran","Mewujudkan pembiayaan pendidikan"],a:"A",
w:["Kerajaan menyediakan <b>latihan perguruan</b> untuk menambah bilangan guru terlatih di Sabah dan Sarawak.",
"Bukan langkah yang ditekankan dalam buku teks.",
"Bukan langkah yang ditekankan dalam buku teks.",
"Terlalu umum dan bukan langkah yang dinyatakan."],
info:{t:"Kemajuan Pendidikan di Sabah & Sarawak",p:[
"Selepas 1963, kerajaan pusat membantu memajukan pendidikan melalui pembinaan sekolah dan latihan guru.",
"Bahasa Melayu diperkenalkan secara berperingkat dalam sistem pendidikan.",
"Tujuan: merapatkan jurang pendidikan dan memupuk perpaduan."]},
tip:"Soalan “Bagaimanakah dimajukan” → cari <b>langkah konkrit</b> yang disebut dalam buku teks."},

{n:32,t:5,h:"125",tp:"Ancaman Komunis Selepas Merdeka",
q:"Bagi melindungi rakyat daripada ancaman komunis, kerajaan telah melaksanakan strategi <i>Counterinsurgency</i> (COIN) melalui usaha",
o:["memenangi hati rakyat","menawarkan pengampunan","melaksanakan catuan makanan","menempatkan semula penduduk"],a:"A",
w:["Teras strategi COIN ialah <b>memenangi hati dan minda rakyat</b> supaya rakyat menyokong kerajaan dan tidak membantu komunis.",
"Pengampunan/amnesti ialah langkah lain untuk menggalakkan komunis menyerah diri.",
"Catuan makanan ialah langkah zaman Darurat untuk memutuskan bekalan kepada komunis.",
"Penempatan semula (Kampung Baru) ialah langkah Rancangan Briggs semasa Darurat."],
info:{t:"Strategi Counterinsurgency (COIN)",p:[
"Strategi menentang pemberontakan dengan menggabungkan <b>keselamatan dan pembangunan</b>.",
"Konsep “memenangi hati dan minda rakyat” dipopularkan semasa Darurat oleh Sir Gerald Templer.",
"Selepas merdeka, ancaman komunis ditangani melalui pendekatan seperti <b>KESBAN</b> (Keselamatan dan Pembangunan)."]},
tip:"Semua pilihan ialah langkah menentang komunis — tetapi soalan khusus tentang <b>COIN</b>."},

{n:33,t:5,h:"140",tp:"Negara Bangsa Malaysia",
q:"Konsep negara bangsa Malaysia diperkukuhkan melalui",
rom:[["asimilasi bangsa",0,"Malaysia tidak mengamalkan asimilasi (meleburkan identiti kaum) — setiap kaum mengekalkan budaya masing-masing."],
["perpaduan kaum",1,"Perpaduan kaum ialah asas negara bangsa."],
["integrasi nasional",1,"Integrasi antara kaum dan antara wilayah mengukuhkan negara bangsa."],
["penyatuan agama",0,"Kebebasan beragama dijamin oleh Perlembagaan (Perkara 11)."]],
o:["I dan II","I dan IV","II dan III","III dan IV"],a:"C",
info:{t:"Negara Bangsa Malaysia",p:[
"Negara bangsa: rakyat pelbagai kaum berkongsi identiti dan taat setia kepada satu negara.",
"Diperkukuh melalui <b>perpaduan kaum</b> dan <b>integrasi nasional</b>.",
"Alat: Rukun Negara, Dasar Pendidikan Kebangsaan, Dasar Kebudayaan Kebangsaan, bahasa kebangsaan."]},
tip:"Tolak I dan IV dahulu — kedua-duanya <b>bercanggah</b> dengan amalan masyarakat majmuk Malaysia."},

{n:34,t:5,h:"158",tp:"Rukun Negara",
q:"Maklumat berikut berkaitan dengan matlamat Rukun Negara.\nBagaimanakah matlamat tersebut dapat dilaksanakan?",
stim:{k:"box",txt:"Melahirkan masyarakat yang progresif"},
o:["Membentuk masyarakat bersatu padu","Memelihara cara hidup demokratik","Mewujudkan peluang yang sama","Meneroka sains dan teknologi"],a:"D",
w:["Ini matlamat Rukun Negara yang <b>lain</b> (perpaduan).",
"Ini matlamat Rukun Negara yang <b>lain</b>.",
"Berkait matlamat masyarakat yang adil.",
"Matlamat penuh: membina masyarakat progresif yang akan <b>menggunakan sains dan teknologi moden</b>."],
info:{t:"Rukun Negara (31 Ogos 1970)",p:[
"Diisytiharkan selepas peristiwa 13 Mei 1969.",
"<b>5 matlamat:</b> perpaduan yang erat; memelihara cara hidup demokratik; masyarakat yang adil; cara liberal terhadap tradisi kebudayaan yang pelbagai; masyarakat progresif yang menggunakan sains dan teknologi moden.",
"<b>5 prinsip:</b> Kepercayaan kepada Tuhan; Kesetiaan kepada Raja dan Negara; Keluhuran Perlembagaan; Kedaulatan Undang-undang; Kesopanan dan Kesusilaan."]},
tip:"Hafal ayat penuh setiap matlamat — kata kunci <b>“progresif” → sains & teknologi</b>."},

{n:35,t:5,h:"169",tp:"Dasar Ekonomi Baru (DEB)",
q:"Rancangan Buku Hijau dilaksanakan dalam rancangan Dasar Ekonomi Baru (DEB).\nMengapakah rancangan tersebut diperkenalkan?",
o:["Melahirkan golongan pertengahan","Membangunkan kemudahan asas","Meningkatkan pendapatan rakyat","Menyusun semula masyarakat"],a:"C",
w:["Tidak berkaitan langsung dengan Buku Hijau.",
"Lebih kepada rancangan pembangunan luar bandar (Buku Merah).",
"Buku Hijau menggalakkan rakyat bercucuk tanam dan menternak untuk <b>menambah pendapatan</b> serta mengurangkan import makanan.",
"<b>Pengecoh!</b> Matlamat DEB secara umum — Buku Hijau lebih khusus kepada membasmi kemiskinan melalui pertanian."],
info:{t:"Rancangan Buku Hijau (1974)",p:[
"Dilancarkan oleh Tun Abdul Razak.",
"Menggalakkan rakyat menanam tanaman makanan dan menternak di kawasan sendiri.",
"Selaras dengan <b>serampang dua mata DEB</b>: membasmi kemiskinan dan menyusun semula masyarakat."]},
tip:"Buku Hijau → <b>pertanian & pendapatan</b>."},

{n:36,t:5,h:"186",tp:"Dasar Pembangunan Nasional (DPN)",
q:"Pelaksanaan Dasar Pembangunan Negara (DPN) telah memperkenalkan taman teknologi perindustrian.\nApakah peranan taman teknologi tersebut?",
o:["Mengeluarkan kereta tempatan","Membangunkan pusat penyelidikan","Melaksanakan projek membaiki kapal","Memajukan industri kecil dan sederhana"],a:"B",
w:["Berkaitan dasar perindustrian berat (cth. Proton) — bukan peranan taman teknologi.",
"Taman teknologi menempatkan <b>pusat penyelidikan dan pembangunan (R&D)</b> untuk memajukan teknologi negara.",
"Bukan peranan taman teknologi.",
"IKS dibangunkan melalui program lain."],
info:{t:"Dasar Pembangunan Nasional (1991–2000)",p:[
"Menggantikan DEB dan menjadi sebahagian daripada <b>Wawasan 2020</b>.",
"Memberi penekanan kepada pembangunan seimbang, sumber manusia, sains dan teknologi.",
"Contoh: Taman Teknologi Malaysia di Bukit Jalil dan Taman Teknologi Tinggi Kulim."]},
tip:"“<b>Teknologi</b>” → penyelidikan dan inovasi."},

{n:37,t:5,h:"206",tp:"Malaysia & Komanwel",
q:"Apakah usaha yang dilakukan oleh anggota Komanwel dalam menangani masalah kemiskinan?",
o:["Menyertai Pertubuhan Kesihatan Sedunia","Melaksanakan Rancangan Colombo","Menubuhkan tabung kemanusiaan","Menyertai sidang kemuncak dunia"],a:"B",
w:["WHO ialah agensi Pertubuhan Bangsa-Bangsa Bersatu, bukan usaha Komanwel.",
"<b>Rancangan Colombo</b> ialah usaha Komanwel memberi bantuan ekonomi, teknikal dan latihan bagi membangunkan negara anggota.",
"Tidak spesifik kepada Komanwel.",
"Terlalu umum."],
info:{t:"Rancangan Colombo (1950)",p:[
"Diasaskan oleh negara-negara Komanwel di Colombo, Sri Lanka.",
"Menyediakan bantuan ekonomi dan teknikal, biasiswa serta latihan kepakaran kepada negara di Asia Selatan dan Asia Tenggara.",
"Malaysia menerima manfaat dan kemudian turut menyumbang kepakaran kepada negara lain."]},
tip:"Komanwel + kemiskinan → <b>Rancangan Colombo</b>."},

{n:38,t:5,h:"213",tp:"Pergerakan Negara-negara Berkecuali (NAM)",
q:"Jadual berikut berkaitan penglibatan Malaysia dalam Pergerakan Negara-negara Tanpa Pihak (NAM).\nApakah kepentingan perisytiharan tersebut?",
stim:{k:"tbl",head:["Tahun","Perjanjian"],rows:[["1970","Perisytiharan Lusaka"]]},
o:["Menamatkan perang saudara","Mengharamkan senjata nuklear","Melaksanakan gencatan senjata","Memindahkan mangsa perang"],a:"B",
w:["Bukan kandungan Perisytiharan Lusaka.",
"Perisytiharan Lusaka menekankan keamanan dunia dan <b>perlucutan senjata, termasuk pengharaman senjata nuklear</b>.",
"Bukan kandungan Perisytiharan Lusaka.",
"Bukan kandungan Perisytiharan Lusaka."],
info:{t:"NAM – Non-Aligned Movement",p:[
"Ditubuhkan pada <b>1961</b> di Belgrade. Negara anggota tidak memihak kepada blok Amerika Syarikat atau Kesatuan Soviet semasa Perang Dingin.",
"Malaysia menyertai NAM pada <b>1970</b>. Di Sidang Kemuncak Lusaka, Zambia, Tun Abdul Razak mengemukakan idea Asia Tenggara sebagai kawasan berkecuali → ZOPFAN (1971).",
"Perisytiharan Lusaka: keamanan, perlucutan senjata, hak menentukan nasib sendiri dan kerjasama ekonomi.",
"Malaysia pernah menjadi tuan rumah dan Pengerusi NAM (2003)."]},
tip:"Lusaka 1970 → <b>perlucutan senjata / nuklear</b> + idea berkecuali Tun Razak."},

{n:39,t:5,h:"231",tp:"Kerjasama Segi Tiga Pertumbuhan",
q:"Peta berikut menunjukkan kawasan yang terlibat dalam kerjasama Pembangunan Ekonomi Segi Tiga.\nApakah manfaat yang diperoleh Malaysia melalui kerjasama tersebut?",
stim:{k:"img",src:"q39",cap:"Lingkungan kawasan SIJORI-GT",w:440},
o:["Mengawal laluan perdagangan","Menjamin kadar cukai yang rendah","Menurunkan harga barangan tempatan","Mengurangkan monopoli negara maju"],a:"D",
w:["Malaysia tidak mengawal laluan perdagangan antarabangsa melalui kerjasama ini.",
"Tiada jaminan sedemikian.",
"Bukan manfaat yang dinyatakan.",
"Kerjasama serantau membolehkan negara jiran berkongsi kelebihan, lalu <b>mengurangkan kebergantungan dan monopoli negara maju</b>."],
info:{t:"Segi Tiga Pertumbuhan",p:[
"<b>SIJORI</b> — Singapura, Johor, Riau.",
"<b>IMT-GT</b> — Indonesia, Malaysia, Thailand. <b>BIMP-EAGA</b> — Brunei, Indonesia, Malaysia, Filipina.",
"Menggabungkan kelebihan setiap kawasan (modal, tanah, tenaga kerja) untuk menarik pelaburan dan memajukan ekonomi serantau."]},
tip:"Kerjasama <b>serantau</b> → negara membangun bergandingan, tidak bergantung pada negara maju."},

{n:40,t:5,h:"232",tp:"Krisis Kewangan Asia 1997–1998",
q:"Pada tahun 1997-1998, kebanyakan negara Asia termasuk Malaysia menghadapi krisis ekonomi.\nMengapakah krisis ini berlaku?",
o:["Perang perdagangan","Spekulasi mata wang","Kenaikan tarif import","Ketidakpastian geopolitik"],a:"B",
w:["Bukan punca krisis 1997.",
"Krisis berpunca daripada <b>spekulasi mata wang</b> — spekulator menjual mata wang serantau secara besar-besaran sehingga nilainya jatuh.",
"Bukan punca krisis 1997.",
"Bukan punca krisis 1997."],
info:{t:"Krisis Kewangan Asia (1997–1998)",p:[
"Bermula di Thailand pada Julai 1997, kemudian merebak ke negara Asia lain.",
"Nilai ringgit jatuh mendadak dan pasaran saham merudum.",
"Malaysia menubuhkan <b>Majlis Tindakan Ekonomi Negara (MTEN)</b>, melaksanakan kawalan modal dan menambat ringgit pada RM3.80 = USD1 — tanpa bergantung pada bantuan IMF."]},
tip:"1997 = <b>spekulasi mata wang</b>. Kaitkan dengan langkah MTEN."}
];
